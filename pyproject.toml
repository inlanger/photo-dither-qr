[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dithered-qr"
version = "0.1.0"
description = "Generate error-diffused QR codes that contain a monochrome image"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=12,<13",
    "segno==1.6.6",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "zxing-cpp==3.1.1",
]

[project.scripts]
dithered-qr = "dithered_qr.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
